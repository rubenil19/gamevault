{# Página de error: recibe codigo (404, 500...) y mensaje desde app.py #}
{% extends "base.html" %}
{% block title %}Error {{ codigo }}{% endblock %}
{% block content %}<div class="empty-state"><div class="empty-icon">{{ codigo }}</div><h1>Vaya, algo ha salido mal</h1><p>{{ mensaje }}</p><a class="button primary" href="{{ url_for('index') }}">Volver a la biblioteca</a></div>{% endblock %}
